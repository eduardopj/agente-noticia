[project]
name = "radar-api"
version = "0.1.0"
description = "Backend e agentes do Radar Tech IA Diario"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.116.0",
  "feedparser>=6.0.11",
  "httpx>=0.28.0",
  "openai>=1.99.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.36",
  "trafilatura>=2.0.0",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
