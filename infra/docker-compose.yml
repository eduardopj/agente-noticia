services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  api:
    build:
      context: ../apps/api
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://radar:radar@postgres:5432/radar
      STORAGE_DIR: /app/storage
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      WHATSAPP_TARGET_NUMBER: ${WHATSAPP_TARGET_NUMBER}
      TIMEZONE: ${TIMEZONE:-America/Rio_Branco}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api-storage:/app/storage
    ports:
      - "8000:8000"

  web:
    build:
      context: ../apps/web
    environment:
      API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8000}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  api-storage:
